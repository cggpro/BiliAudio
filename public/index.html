<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiliAudio - 轻量B站音频播放器</title>
<style>
/* ========== Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a14; --bg-card: #12122a; --bg-input: #1a1a3a;
  --bg-hover: #1e1e40; --bg-active: #252550;
  --text: #e0e0f0; --text-secondary: #9090b0; --text-muted: #606080;
  --pink: #fb7299; --pink-light: #ff8db3; --pink-dark: #d44a72;
  --blue: #00a1d6; --blue-light: #00b5e5;
  --green: #4caf84; --green-light: #5ec89a;
  --progress-bg: #2a2a4a; --border: #1e1e3a;
  --shadow: 0 4px 24px rgba(0,0,0,.5);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #06060f; color: var(--text);
  display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
  position: relative;
}

/* ========== 背景动效（纯CSS，GPU加速，零内存） ========== */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(251,114,153,.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(0,161,214,.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(100,80,220,.03) 0%, transparent 70%);
  animation: bgShift 12s ease-in-out infinite;
}
@keyframes bgShift { 0%,100%{opacity:.7} 25%{opacity:1} 50%{opacity:.5} 75%{opacity:.9} }

body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle 180px at 15% 25%, rgba(251,114,153,.12), transparent),
    radial-gradient(circle 140px at 75% 60%, rgba(0,161,214,.1), transparent),
    radial-gradient(circle 200px at 50% 80%, rgba(120,80,240,.08), transparent),
    radial-gradient(circle 100px at 85% 15%, rgba(251,114,153,.07), transparent);
  animation: orbFloat 16s ease-in-out infinite;
}
@keyframes orbFloat {
  0%,100%{ background: radial-gradient(circle 180px at 15% 25%, rgba(251,114,153,.12), transparent), radial-gradient(circle 140px at 75% 60%, rgba(0,161,214,.1), transparent), radial-gradient(circle 200px at 50% 80%, rgba(120,80,240,.08), transparent), radial-gradient(circle 100px at 85% 15%, rgba(251,114,153,.07), transparent); }
  33%{ background: radial-gradient(circle 200px at 25% 35%, rgba(251,114,153,.1), transparent), radial-gradient(circle 120px at 65% 50%, rgba(0,161,214,.12), transparent), radial-gradient(circle 180px at 40% 70%, rgba(120,80,240,.06), transparent), radial-gradient(circle 130px at 80% 25%, rgba(251,114,153,.09), transparent); }
  66%{ background: radial-gradient(circle 160px at 10% 40%, rgba(251,114,153,.08), transparent), radial-gradient(circle 160px at 80% 45%, rgba(0,161,214,.08), transparent), radial-gradient(circle 220px at 55% 85%, rgba(120,80,240,.1), transparent), radial-gradient(circle 90px at 70% 10%, rgba(251,114,153,.06), transparent); }
}

/* 网格线（极淡） */
.bg-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .025;
  background-image: linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridMove 30s linear infinite;
}
@keyframes gridMove { 0%{background-position:0 0} 100%{background-position:60px 60px} }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== Header ========== */
.header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: var(--bg-card);
  border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10;
}
.logo { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; white-space: nowrap; color: var(--pink); }
.logo svg { width: 24px; height: 24px; }
.url-input-wrap { flex: 1; position: relative; max-width: 560px; display: flex; gap: 6px; align-items: center; }
.url-input {
  flex: 1; padding: 9px 12px; background: var(--bg-input);
  border: 2px solid var(--border); border-radius: 22px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color var(--transition);
}
.url-input:focus { border-color: var(--pink); }
.url-input::placeholder { color: var(--text-muted); }

.add-target {
  padding: 7px 10px; background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 18px; color: var(--text); font-size: 12px; cursor: pointer;
  outline: none; white-space: nowrap; max-width: 140px;
}
.add-target:focus { border-color: var(--blue); }

.btn-parse {
  padding: 8px 18px; background: var(--pink); color: #fff;
  border: none; border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background var(--transition); white-space: nowrap;
}
.btn-parse:hover { background: var(--pink-light); }
.btn-parse.loading { pointer-events: none; opacity: 0.7; }

/* ========== Main Layout ========== */
.main { flex: 1; display: flex; overflow: hidden; min-height: 0; position: relative; }

/* ========== 播放器背景光效（纯CSS，GPU加速，零内存） ========== */
.player-bg-glow {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at center, rgba(251,114,153,.08) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.8s ease;
}
.player-bg-glow.active { opacity: 1; animation: bgPulse 3s ease-in-out infinite; }
@keyframes bgPulse {
  0%,100% { background: radial-gradient(ellipse at 48% 50%, rgba(251,114,153,.06) 0%, transparent 70%); }
  50% { background: radial-gradient(ellipse at 52% 48%, rgba(0,161,214,.08) 0%, transparent 70%); }
}

.player-panel {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px; min-width: 260px; gap: 18px; position: relative; z-index: 1;
}

/* ========== 封面 + 黑胶唱片动效 ========== */
.cover-wrap {
  position: relative; width: min(280px, 44vw); aspect-ratio: 1;
  border-radius: 50%; flex-shrink: 0; z-index: 2;
}
/* 黑胶唱片底 */
.cover-disc {
  position: absolute; inset: -8%; border-radius: 50%;
  background: conic-gradient(from 0deg, #1a1a1a 0%, #2a2a2a 2%, #111 4%, #333 6%, #1a1a1a 8%, #222 10%, #111 12%, #2a2a2a 14%, #1a1a1a 16%, #333 18%, #111 20%, #222 22%, #1a1a1a 24%, #2a2a2a 26%, #111 28%, #333 30%, #1a1a1a 32%, #222 34%, #111 36%, #2a2a2a 38%, #1a1a1a 40%, #333 42%, #111 44%, #222 46%, #1a1a1a 48%, #2a2a2a 50%, #111 52%, #333 54%, #1a1a1a 56%, #222 58%, #111 60%, #2a2a2a 62%, #1a1a1a 64%, #333 66%, #111 68%, #222 70%, #1a1a1a 72%, #2a2a2a 74%, #111 76%, #333 78%, #1a1a1a 80%, #222 82%, #111 84%, #2a2a2a 86%, #1a1a1a 88%, #333 90%, #111 92%, #222 94%, #1a1a1a 96%, #2a2a2a 98%, #1a1a1a 100%);
  opacity: 0; transform: scale(0.8); transition: all 0.5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 30px rgba(0,0,0,.6), inset 0 0 20px rgba(0,0,0,.3);
}
.cover-wrap.playing .cover-disc { opacity: 1; transform: scale(1); animation: spin 8s linear infinite; }
/* 唱片中心圆 */
.cover-disc::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 22%; height: 22%; border-radius: 50%;
  background: var(--pink); transform: translate(-50%,-50%);
  box-shadow: 0 0 15px rgba(251,114,153,.6), 0 0 5px rgba(0,0,0,.5);
  z-index: 3;
}
@keyframes spin { to { transform: scale(1) rotate(360deg); } }

/* 封面图（圆形的，在黑胶上面） */
.cover-inner {
  position: absolute; inset: 10%; border-radius: 50%;
  overflow: hidden; z-index: 2;
  box-shadow: 0 0 0 4px var(--bg-card), 0 0 25px rgba(251,114,153,.3);
  transition: box-shadow 0.5s ease;
}
.cover-wrap.playing .cover-inner { box-shadow: 0 0 0 4px var(--bg-card), 0 0 40px rgba(251,114,153,.5), 0 0 80px rgba(251,114,153,.15); }
.cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--bg-card), var(--bg-input)); font-size: 48px;
}

/* ========== 频谱动效（纯CSS） ========== */
.eq-bars {
  display: flex; gap: 4px; align-items: flex-end; height: 28px;
  opacity: 0; transition: opacity 0.4s;
}
.eq-bars.active { opacity: 1; }
.eq-bar {
  width: 4px; border-radius: 2px;
  background: linear-gradient(to top, var(--pink), var(--blue));
  animation: eqAnim 0.9s ease-in-out infinite;
}
.eq-bar:nth-child(1){height:12px;animation-delay:0s}
.eq-bar:nth-child(2){height:22px;animation-delay:.12s;animation-duration:.7s}
.eq-bar:nth-child(3){height:8px;animation-delay:.24s;animation-duration:1.1s}
.eq-bar:nth-child(4){height:26px;animation-delay:.36s;animation-duration:.65s}
.eq-bar:nth-child(5){height:14px;animation-delay:.48s;animation-duration:.85s}
.eq-bar:nth-child(6){height:20px;animation-delay:.6s;animation-duration:.75s}
.eq-bar:nth-child(7){height:10px;animation-delay:.72s;animation-duration:1s}
.eq-bar:nth-child(8){height:24px;animation-delay:.84s;animation-duration:.7s}
@keyframes eqAnim {
  0%,100% { transform: scaleY(0.3); opacity: 0.5; }
  50% { transform: scaleY(1); opacity: 1; }
}

/* ========== 曲目标题滚动 ========== */
.np-title-wrap { max-width: 420px; width: 100%; overflow: hidden; position: relative; }
.np-title {
  font-size: 18px; font-weight: 600; line-height: 1.4;
  white-space: nowrap; display: inline-block;
}
.np-title.scroll {
  animation: titleScroll 10s linear infinite;
}
@keyframes titleScroll {
  0% { transform: translateX(0); }
  20% { transform: translateX(0); }
  80% { transform: translateX(calc(-100% + 320px)); }
  100% { transform: translateX(calc(-100% + 320px)); }
}
.now-playing { text-align: center; max-width: 420px; width: 100%; }
.np-owner { font-size: 14px; color: var(--text-secondary); }
.np-page { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

/* ========== 进度条（加粗放大） ========== */
.progress-wrap { width: 100%; max-width: 460px; display: flex; align-items: center; gap: 10px; }
.progress-time { font-size: 13px; color: var(--text-secondary); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }

/* 进度条轨道（外层容器，负责显示背景/边框） */
.progress-track {
  flex: 1; position: relative; height: 8px;
  background: #3a3a5a; border-radius: 4px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  border: 1px solid rgba(255,255,255,.15);
  overflow: hidden;
}
/* 进度条滑块（透明，只留拖拽圆点） */
.progress-bar {
  width: 100%; height: 8px; background: transparent;
  cursor: pointer; -webkit-appearance: none; appearance: none; outline: none;
  position: absolute; inset: 0; z-index: 2; margin: 0;
}
.progress-bar::-webkit-slider-runnable-track { height: 8px; background: transparent; border: none; }
.progress-bar::-moz-range-track { height: 8px; background: transparent; border: none; }
.progress-bar::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--pink); cursor: pointer; box-shadow: 0 0 12px rgba(251,114,153,.6);
  margin-top: -5px; position: relative; z-index: 2;
}
/* 进度条填充 */
.progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--pink), var(--blue));
  pointer-events: none; z-index: 1;
  transition: width 0.1s linear;
}
.progress-fill.playing {
  background: linear-gradient(90deg, var(--pink), var(--blue), var(--pink));
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ========== 控件 ========== */
.controls { display: flex; align-items: center; gap: 18px; }
.ctrl-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--bg-card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--transition), transform var(--transition); }
.ctrl-btn:hover { background: var(--bg-hover); transform: scale(1.06); }
.ctrl-btn:active { transform: scale(0.93); }
.ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn-play { width: 62px; height: 62px; background: var(--pink); color: #fff; position: relative; }
.btn-play:hover { background: var(--pink-light); transform: scale(1.08); }
.btn-play:active { transform: scale(0.94); }
.btn-play svg { width: 26px; height: 26px; }
/* 播放按钮光环 */
.btn-play::after {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid rgba(251,114,153,.3); opacity: 0; transition: opacity 0.3s;
}
.cover-wrap.playing ~ .controls .btn-play::after { opacity: 1; animation: btnGlow 2s ease-in-out infinite; }
@keyframes btnGlow {
  0%,100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.2); opacity: 0.6; }
}

.volume-wrap { display: flex; align-items: center; gap: 6px; }
.volume-slider { width: 70px; height: 4px; background: var(--progress-bg); border-radius: 2px; cursor: pointer; -webkit-appearance: none; appearance: none; outline: none; }
.volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); cursor: pointer; }

/* ========== Sidebar (Resizable) ========== */
.sidebar {
  width: 360px; min-width: 260px; max-width: 600px;
  background: var(--bg-card); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; position: relative;
}
.resize-handle {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
  cursor: col-resize; z-index: 20; background: transparent;
  transition: background 0.2s;
}
.resize-handle:hover, .resize-handle.active { background: var(--pink); }

/* 歌单区域 */
.playlist-sections { flex-shrink: 0; border-bottom: 1px solid var(--border); max-height: 45%; display: flex; flex-direction: column; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; font-size: 13px; font-weight: 600; gap: 6px;
  background: var(--bg-input); flex-shrink: 0;
}
.section-header span { white-space: nowrap; }
.btn-sm {
  padding: 4px 10px; border-radius: 12px; border: none; font-size: 11px;
  cursor: pointer; white-space: nowrap; transition: background var(--transition); color: #fff;
}
.btn-sm.primary { background: var(--blue); }
.btn-sm.primary:hover { background: var(--blue-light); }
.btn-sm.danger { background: #555; }
.btn-sm.danger:hover { background: #777; }
.btn-sm.green { background: var(--green); }
.btn-sm.green:hover { background: var(--green-light); }

.playlist-tabs { overflow-y: auto; flex: 1; }
.playlist-tab {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  cursor: pointer; transition: background var(--transition);
  border-left: 3px solid transparent; font-size: 13px;
}
.playlist-tab:hover { background: var(--bg-hover); }
.playlist-tab.active { background: var(--bg-active); border-left-color: var(--blue); }
.playlist-tab .tab-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.playlist-tab .tab-count { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.playlist-tab .tab-actions { display: flex; gap: 3px; flex-shrink: 0; }
.tab-actions button {
  width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 11px; display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--text-muted); transition: all var(--transition);
}
.tab-actions button:hover { background: var(--bg-active); color: var(--text); }

/* 歌单内容展开区 */
.playlist-expand {
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  max-height: 35%; display: flex; flex-direction: column;
  overflow: hidden;
}
.expand-list { overflow-y: auto; flex: 1; min-height: 0; }

/* 播放队列区域 */
.queue-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.queue-header-actions { display: flex; gap: 4px; }
.playlist-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.playlist-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  cursor: pointer; transition: background var(--transition);
  border-left: 3px solid transparent; font-size: 12px;
  content-visibility: auto; contain-intrinsic-size: auto 50px;
}
.playlist-item:hover { background: var(--bg-hover); }
.playlist-item.active { background: var(--bg-active); border-left-color: var(--pink); }
.playlist-item.active .pl-title { color: var(--pink); }
.pl-index { width: 20px; text-align: center; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.pl-cover { width: 30px; height: 30px; border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-muted); }
.pl-info { flex: 1; min-width: 0; }
.pl-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.pl-meta { font-size: 11px; color: var(--text-muted); }
.pl-duration { font-size: 11px; color: var(--text-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.btn-remove {
  width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 14px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; opacity: 0; transition: opacity var(--transition);
}
.playlist-item:hover .btn-remove { opacity: 1; }
.btn-remove:hover { color: #ff6b6b; }
.playlist-empty { text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 13px; line-height: 1.8; }

/* ========== Toast ========== */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  padding: 8px 20px; background: var(--bg-card); color: var(--text);
  border-radius: 18px; font-size: 13px; z-index: 100; opacity: 0;
  pointer-events: none; transition: opacity 0.3s cubic-bezier(.4,0,.2,1);
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.toast.show { opacity: 1; }
.toast.error { border-color: #ff6b6b; color: #ff6b6b; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  html, body { height: auto; overflow: auto; }
  .main { flex-direction: column; overflow: visible; flex: none; }
  .player-panel { flex-shrink: 0; padding: 12px 10px; gap: 10px; min-width: 0; flex: none; }
  .cover-wrap { width: min(160px, 40vw); }
  .cover-placeholder { font-size: 36px; }
  .np-title { font-size: 15px; }
  .np-title-wrap { max-width: 90vw; }
  .np-owner { font-size: 12px; }
  .now-playing { max-width: 90vw; }
  .progress-wrap { max-width: 90vw; gap: 6px; }
  .progress-time { font-size: 11px; min-width: 34px; }
  .progress-track { height: 6px; }
  .progress-bar { height: 6px; }
  .progress-bar::-webkit-slider-runnable-track { height: 6px; }
  .progress-bar::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -5px; }
  .controls { gap: 12px; }
  .ctrl-btn { width: 40px; height: 40px; }
  .ctrl-btn svg { width: 16px; height: 16px; }
  .btn-play { width: 52px; height: 52px; }
  .btn-play svg { width: 22px; height: 22px; }

  .sidebar {
    width: 100% !important; max-width: 100% !important; min-width: 100% !important;
    flex: none; border-left: none; border-top: 1px solid var(--border);
    overflow: visible; height: auto;
  }
  .resize-handle { display: none; }

  /* 歌单展开区手机：限制最大高度防止撑开 */
  .playlist-expand { max-height: 300px; flex: none; }
  .expand-list { max-height: 260px; }
  .playlist-sections { max-height: none; flex: none; }
  .playlist-tabs { max-height: 120px; overflow-y: auto; }

  /* 播放队列手机：限制最大高度 */
  .queue-section { flex: none; }
  .playlist-list { max-height: 400px; overflow-y: auto; }

  .header { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
  .logo { font-size: 15px; }
  .logo svg { width: 20px; height: 20px; }
  .url-input-wrap { max-width: none; flex: 1 1 100%; order: 1; }
  .url-input { font-size: 16px; padding: 8px 10px; }
  .add-target { font-size: 11px; padding: 5px 8px; max-width: 110px; }
  .btn-parse { font-size: 12px; padding: 7px 14px; }

  /* 触摸优化 */
  .playlist-item { padding: 10px 10px; min-height: 44px; }
  .btn-remove { width: 28px; height: 28px; font-size: 16px; opacity: 1; }
  .tab-actions button { width: 28px; height: 28px; font-size: 13px; }
  .pl-index { font-size: 13px; width: 24px; }
  .pl-title { font-size: 13px; }
  .pl-duration { font-size: 12px; }

  .section-header { padding: 10px 10px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 14px; }
  .playlist-tab { padding: 10px 10px; font-size: 13px; }

  .volume-slider { width: 50px; }
  .eq-bars { height: 22px; gap: 3px; }
  .eq-bar { width: 3px; }

  .toast { font-size: 12px; padding: 6px 16px; top: 10px; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="10,8 10,16 17,12" fill="currentColor"/></svg>
    BiliAudio
  </div>
  <div class="url-input-wrap">
    <input class="url-input" type="text" placeholder="粘贴B站链接或BV号…" id="urlInput" autocomplete="off">
    <select class="add-target" id="addTarget" title="选择添加目标">
      <option value="queue">📋 播放队列</option>
    </select>
    <button class="btn-parse" id="btnParse">解析</button>
  </div>
</div>

<div class="main">
  <!-- 背景光效 -->
  <div class="player-bg-glow" id="bgGlow"></div>

  <div class="player-panel">
    <div class="cover-wrap" id="coverWrap">
      <div class="cover-disc"></div>
      <div class="cover-inner">
        <div class="cover-placeholder">🎵</div>
        <img class="cover-img" id="coverImg" src="" alt="" style="display:none">
      </div>
    </div>
    <div class="eq-bars" id="eqBars">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
    <div class="now-playing">
      <div class="np-title-wrap"><span class="np-title" id="npTitle">等待播放…</span></div>
      <div class="np-owner" id="npOwner"></div>
      <div class="np-page" id="npPage"></div>
    </div>
    <div class="progress-wrap">
      <span class="progress-time" id="timeCurrent">00:00</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
        <input type="range" class="progress-bar" id="progressBar" min="0" max="1000" value="0">
      </div>
      <span class="progress-time" id="timeDuration">00:00</span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24"><polygon points="20,5 20,19 10,12"/><rect x="4" y="5" width="3" height="14"/></svg>
      </button>
      <button class="ctrl-btn btn-play" id="btnPlay" title="播放/暂停">
        <svg viewBox="0 0 24 24" id="iconPlay"><polygon points="8,5 8,19 19,12"/></svg>
        <svg viewBox="0 0 24 24" id="iconPause" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ctrl-btn" id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24"><polygon points="4,5 4,19 14,12"/><rect x="17" y="5" width="3" height="14"/></svg>
      </button>
    </div>
    <div class="volume-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.6"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="resize-handle" id="resizeHandle"></div>

    <div class="playlist-sections" id="playlistSections">
      <div class="section-header">
        <span>📁 我的歌单</span>
        <button class="btn-sm primary" id="btnNewPlaylist">+ 新建</button>
      </div>
      <div class="playlist-tabs" id="playlistTabs">
        <div class="playlist-empty">暂无歌单<br>解析视频时可选择"🆕 新建歌单"</div>
      </div>
    </div>

    <!-- 歌单展开内容（点歌单tab后出现在这里，独立于播放队列） -->
    <div class="playlist-expand" id="playlistExpand" style="display:none">
      <div class="section-header" style="background:var(--bg-active);">
        <span id="expandTitle">歌单</span>
        <div class="queue-header-actions">
          <button class="btn-sm green" id="btnExpandPlay" title="替换播放队列">▶ 播放</button>
          <button class="btn-sm primary" id="btnExpandAdd" title="追加到播放队列">＋ 追加</button>
          <button class="btn-sm primary" id="btnExpandColl" title="加载合集到歌单">📋 合集</button>
          <button class="btn-sm danger" id="btnExpandClose">✕ 收起</button>
        </div>
      </div>
      <div class="playlist-list expand-list" id="expandList"></div>
    </div>

    <div class="queue-section">
      <div class="section-header">
        <span>🎶 播放队列 <span style="font-weight:400;color:var(--text-muted)" id="plCount">0首</span></span>
        <div class="queue-header-actions">
          <button class="btn-sm primary" id="btnLoadCollection" disabled>📋 加载合集</button>
          <button class="btn-sm danger" id="btnClearAll">🗑️ 清空</button>
        </div>
      </div>
      <div class="playlist-list" id="playlistList">
        <div class="playlist-empty">👆 输入B站链接，<br>选择目标后开始 🎵</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 状态 ====================
const state = {
  queue: [],
  currentIndex: -1,
  playlists: {},
  activePlaylistId: null,
  audio: null,
  isPlaying: false,
  volume: 0.8,
  collectionInfo: null,
  isLoading: false,
};

const $ = s => document.querySelector(s);
function formatTime(s) { if(!s||!isFinite(s))return'00:00'; const m=Math.floor(s/60); return `${String(m).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function toast(msg, isErr) { const e=$('#toast'); e.textContent=msg; e.className='toast show'+(isErr?' error':''); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),2500); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function proxyImg(u) { if(!u||u.startsWith('/api/')||u.startsWith('data:'))return u; return`/api/image?url=${encodeURIComponent(u)}`; }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function apiFetch(ep, params={}) {
  const qs=Object.entries(params).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  const r=await fetch(`/api/${ep}${qs?'?'+qs:''}`);
  if(r.headers.get('content-type')?.includes('json')){ const d=await r.json(); if(!r.ok||d.error)throw new Error(d.error||`HTTP ${r.status}`); return d; }
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r;
}

// ==================== 持久化 ====================
function saveAll() {
  try {
    localStorage.setItem('biliaudio_queue', JSON.stringify(state.queue));
    localStorage.setItem('biliaudio_index', state.currentIndex);
    localStorage.setItem('biliaudio_volume', state.volume);
    localStorage.setItem('biliaudio_playlists', JSON.stringify(state.playlists));
    localStorage.setItem('biliaudio_active_pl', state.activePlaylistId||'');
    if(state.collectionInfo) localStorage.setItem('biliaudio_coll_info', JSON.stringify(state.collectionInfo));
    else localStorage.removeItem('biliaudio_coll_info');
  }catch(e){}
}

function loadAll() {
  try {
    const q=localStorage.getItem('biliaudio_queue');
    if(q) state.queue=JSON.parse(q).filter(i=>i.cid&&i.bvid);
    state.currentIndex=parseInt(localStorage.getItem('biliaudio_index')||'0');
    state.volume=parseFloat(localStorage.getItem('biliaudio_volume')||'0.8');
    const pl=localStorage.getItem('biliaudio_playlists');
    if(pl) state.playlists=JSON.parse(pl);
    state.activePlaylistId=localStorage.getItem('biliaudio_active_pl')||null;
    const ci=localStorage.getItem('biliaudio_coll_info');
    if(ci) state.collectionInfo=JSON.parse(ci);
    if(state.currentIndex>=state.queue.length) state.currentIndex=0;
    if(state.queue.length>0){ renderAll(); playIndex(state.currentIndex,false); }
    else renderAll();
  }catch(e){}
}

// ==================== 歌单 ====================
function createPlaylist(name) {
  const id=uid();
  state.playlists[id]={ name, songs:[], collectionInfo:null };
  // 不再自动切换到歌单视图，用户手动点击才切换
  saveAll(); renderAll();
  toast(`已创建歌单「${name}」`);
  return id;
}

function deletePlaylist(id) {
  if(!confirm(`删除歌单「${state.playlists[id]?.name}」？`))return;
  delete state.playlists[id];
  if(state.activePlaylistId===id) state.activePlaylistId=null;
  saveAll(); renderAll();
}

function addToPlaylist(plId, songs) {
  const pl=state.playlists[plId]; if(!pl)return;
  for(const s of songs){ if(!pl.songs.find(x=>x.bvid===s.bvid&&x.cid===s.cid)) pl.songs.push(s); }
  saveAll(); renderAll();
  toast(`已添加 ${songs.length} 首 →「${pl.name}」`);
}

function removeFromPlaylist(plId, idx) {
  state.playlists[plId]?.songs.splice(idx,1); saveAll(); renderAll();
}

function loadPlaylistToQueue(plId) {
  const pl=state.playlists[plId]; if(!pl||!pl.songs.length){ toast('歌单为空',true); return; }
  state.queue=[...pl.songs]; state.currentIndex=0; state.activePlaylistId=null; // 切回播放队列视图
  state.collectionInfo=pl.collectionInfo?{...pl.collectionInfo}:null;
  if(state.collectionInfo){ $('#btnLoadCollection').disabled=false; $('#btnLoadCollection').textContent=`📋 加载合集 (${pl.songs.length}集)`; }
  saveAll(); renderAll(); playIndex(0);
  toast(`已加载歌单「${pl.name}」(${pl.songs.length}首)`);
}

function addPlaylistToQueue(plId) {
  const pl=state.playlists[plId]; if(!pl||!pl.songs.length)return;
  const was=state.queue.length===0;
  for(const s of pl.songs){ if(!state.queue.find(x=>x.bvid===s.bvid&&x.cid===s.cid)) state.queue.push(s); }
  saveAll(); renderAll(); if(was) playIndex(0);
  toast(`已追加「${pl.name}」`);
}

function addSongToQueue(song) {
  if(state.queue.find(x=>x.bvid===song.bvid&&x.cid===song.cid)) return;
  const was=state.queue.length===0; state.queue.push(song);
  saveAll(); renderAll(); if(was) playIndex(0);
  toast('已添加到播放队列');
}

async function loadCollectionForPlaylist(plId) {
  const pl=state.playlists[plId]; if(!pl||!pl.collectionInfo||state.isLoading)return;
  state.isLoading=true;
  try {
    const first=pl.songs[0]; if(!first){ toast('歌单为空',true); return; }
    const info=await apiFetch('video-info',{bvid:first.bvid});
    if(!info.collection?.episodes?.length){ toast('无合集数据',true); return; }
    pl.songs=info.collection.episodes.map(ep=>({
      bvid:ep.bvid,cid:ep.cid,title:ep.title,pageTitle:ep.title,
      cover:ep.cover,owner:ep.owner||pl.songs[0]?.owner||{},
      duration:ep.duration||0,page:ep.page||1,
    }));
    pl.collectionInfo={ title:info.collection.title, season_id:info.collection.id, mid:info.owner?.mid };
    state.activePlaylistId = plId;
    renderExpand();
    renderPlaylistTabs();
    saveAll(); renderAll();
    toast(`「${pl.name}」合集加载完成(${pl.songs.length}首)`);
  }catch(e){ toast('加载失败: '+e.message,true); }
  finally{ state.isLoading=false; }
}

// ==================== 播放队列 ====================
function clearQueue() {
  // 始终清空播放队列
  if (state.queue.length === 0) return;
  state.queue = []; state.currentIndex = -1; state.collectionInfo = null;
  if (state.audio) { state.audio.pause(); state.audio.src = ''; }
  state.isPlaying = false;
  $('#iconPlay').style.display = 'block'; $('#iconPause').style.display = 'none';
  $('#coverWrap').classList.remove('playing'); $('#eqBars').classList.remove('active');
  $('#bgGlow').classList.remove('active'); $('#progressFill').classList.remove('playing');
  $('#npTitle').textContent = '等待播放…'; $('#npTitle').classList.remove('scroll');
  $('#npOwner').textContent = ''; $('#npPage').textContent = '';
  $('#timeCurrent').textContent = '00:00'; $('#timeDuration').textContent = '00:00';
  $('#progressBar').value = 0; $('#progressFill').style.width = '0%';
  $('#btnLoadCollection').disabled = true; $('#btnLoadCollection').textContent = '📋 无合集';
  $('#coverImg').style.display = 'none'; $('.cover-placeholder').style.display = 'flex'; $('#coverImg').src = '';
  // 彻底清除localStorage
  localStorage.removeItem('biliaudio_queue');
  localStorage.removeItem('biliaudio_index');
  localStorage.removeItem('biliaudio_coll_info');
  saveAll(); renderAll();
  toast('播放队列已清空');
}

function removeFromQueue(idx) {
  if(state.queue.length<=1){ clearQueue(); return; }
  state.queue.splice(idx,1);
  if(idx<state.currentIndex) state.currentIndex--;
  else if(idx===state.currentIndex){ if(state.currentIndex>=state.queue.length) state.currentIndex=state.queue.length-1; playIndex(state.currentIndex); }
  saveAll(); renderAll();
}

// ==================== 音频 ====================
function initAudio() {
  if(state.audio){ state.audio.pause(); state.audio.src=''; state.audio.remove(); }
  const a=new Audio(); a.preload='auto'; a.volume=state.volume; a.muted=false;
  a.addEventListener('loadedmetadata',()=>{ $('#progressBar').max=1000; $('#timeDuration').textContent=formatTime(a.duration); });
  let _lastTu = 0;
  a.addEventListener('timeupdate',()=>{
    const now = Date.now();
    if (now - _lastTu < 200) return; // 节流到5fps
    _lastTu = now;
    if(a.duration>0){ const pct=(a.currentTime/a.duration)*100; $('#progressBar').value=(a.currentTime/a.duration)*1000; $('#progressFill').style.width=pct+'%'; }
    $('#timeCurrent').textContent=formatTime(a.currentTime);
  });
  a.addEventListener('play',()=>{ a.muted=false; state.isPlaying=true; $('#iconPlay').style.display='none'; $('#iconPause').style.display='block'; $('#coverWrap').classList.add('playing'); $('#eqBars').classList.add('active'); $('#bgGlow').classList.add('active'); $('#progressFill').classList.add('playing'); });
  a.addEventListener('pause',()=>{ state.isPlaying=false; $('#iconPlay').style.display='block'; $('#iconPause').style.display='none'; $('#coverWrap').classList.remove('playing'); $('#eqBars').classList.remove('active'); $('#bgGlow').classList.remove('active'); $('#progressFill').classList.remove('playing'); });
  a.addEventListener('ended',()=>playNext());
  a.addEventListener('error',()=>{ if(!a.src||a.src===location.href||a.src.endsWith('/undefined'))return; toast('音频加载失败',true); state.isPlaying=false; $('#iconPlay').style.display='block'; $('#iconPause').style.display='none'; });
  state.audio=a;
}

function audioUrl(b,c){ return`/api/audio-stream?bvid=${encodeURIComponent(b)}&cid=${encodeURIComponent(c)}`; }

function playIndex(idx, auto=true) {
  if(idx<0||idx>=state.queue.length)return;
  state.currentIndex=idx; const it=state.queue[idx];
  if(!state.audio)initAudio();
  $('#npTitle').textContent=it.pageTitle||it.title||'未知';
  // 长标题滚动效果
  const tw=$('#npTitle');
  tw.classList.remove('scroll');
  if(tw.scrollWidth>tw.parentElement.clientWidth) tw.classList.add('scroll');
  $('#npOwner').textContent=it.owner?.name?`UP主: ${it.owner.name}`:'';
  $('#npPage').textContent=it.page>1?`P${it.page}`:'';
  $('#timeCurrent').textContent='00:00'; $('#timeDuration').textContent=formatTime(it.duration);
  $('#progressBar').value=0; $('#progressFill').style.width='0%';
  if(it.cover){ $('#coverImg').src=proxyImg(it.cover); $('#coverImg').style.display='block'; $('.cover-placeholder').style.display='none'; }
  else{ $('#coverImg').style.display='none'; $('.cover-placeholder').style.display='flex'; }
  document.title=`${it.pageTitle||it.title||'BiliAudio'} - BiliAudio`;
  state.audio.src=audioUrl(it.bvid,it.cid); state.audio.load();
  if(auto) state.audio.play().catch(e=>toast('点击播放按钮开始播放'));
  saveAll(); highlightActive();
}

// 只更新当前播放项高亮，不重建整个列表（核心性能优化）
function highlightActive() {
  const items = document.querySelectorAll('#playlistList .playlist-item');
  items.forEach((el, i) => {
    const idx = el.querySelector('.pl-index');
    if (i === state.currentIndex) {
      el.classList.add('active');
      if (idx) idx.textContent = '▶';
    } else {
      el.classList.remove('active');
      if (idx) idx.textContent = i + 1;
    }
  });
  const active = document.querySelector('#playlistList .playlist-item.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function playNext(){ if(state.queue.length) playIndex((state.currentIndex+1)%state.queue.length); }
function playPrev(){ if(state.queue.length){ const p=state.currentIndex-1; playIndex(p<0?state.queue.length-1:p); } }

// ==================== 解析 ====================
async function addVideo(inputUrl) {
  if(state.isLoading)return; state.isLoading=true;
  $('#btnParse').classList.add('loading'); $('#btnParse').textContent='…';
  try {
    const info=await apiFetch('video-info',{url:inputUrl});
    const items=info.pages.map(p=>({
      bvid:info.bvid,cid:p.cid,title:info.title,
      pageTitle:info.pages.length>1?`${info.title} - ${p.title}`:info.title,
      cover:info.cover,owner:info.owner,duration:p.duration||info.duration,page:p.page,
    }));
    const target=$('#addTarget').value;

    if(target==='queue'){
      const was=state.queue.length===0;
      for(const it of items) state.queue.push(it);
      if(info.collection){
        state.collectionInfo={ season_id:info.collection.id, mid:info.owner.mid, title:info.collection.title, episodes:info.collection.episodes };
        $('#btnLoadCollection').disabled=false;
        $('#btnLoadCollection').textContent=`📋 加载合集 (${info.collection.episodeCount||'?'}集)`;
      }
      saveAll(); renderAll(); if(was) playIndex(0);
      toast(`已添加 → 播放队列`);
    } else if(target.startsWith('pl_')){
      addToPlaylist(target.slice(3), items);
      if(info.collection&&state.playlists[target.slice(3)]){
        state.playlists[target.slice(3)].collectionInfo={ season_id:info.collection.id, mid:info.owner.mid, title:info.collection.title };
        saveAll(); renderAll();
      }
    } else if(target==='__new__'){
      const nm=info.collection?.title||info.title||'新歌单';
      const id=createPlaylist(nm);
      addToPlaylist(id, items);
      if(info.collection&&state.playlists[id]){
        state.playlists[id].collectionInfo={ season_id:info.collection.id, mid:info.owner.mid, title:info.collection.title };
        saveAll(); renderAll();
      }
    }
    $('#urlInput').value='';
  }catch(e){ toast(e.message||'解析失败',true); }
  finally{ state.isLoading=false; $('#btnParse').classList.remove('loading'); $('#btnParse').textContent='解析'; }
}

async function loadCollectionToQueue() {
  if(!state.collectionInfo?.episodes?.length){ toast('无合集数据',true); return; }
  state.queue=state.collectionInfo.episodes.map(ep=>({
    bvid:ep.bvid,cid:ep.cid,title:ep.title,pageTitle:ep.title,
    cover:ep.cover,owner:ep.owner||state.queue[0]?.owner||{},
    duration:ep.duration||0,page:ep.page||1,
  }));
  state.currentIndex=0; saveAll(); renderAll(); playIndex(0);
  toast(`合集「${state.collectionInfo.title}」(${state.queue.length}首)`);
}

// ==================== 渲染 ====================
function renderAll() {
  updateAddTarget();
  renderPlaylistTabs();
  if (state.activePlaylistId) renderExpand();
  renderQueue();
}

function updateAddTarget() {
  const s=$('#addTarget'); s.innerHTML='<option value="queue">📋 播放队列</option>';
  for(const id of Object.keys(state.playlists)) s.innerHTML+=`<option value="pl_${id}">📁 ${esc(state.playlists[id].name)}</option>`;
  s.innerHTML+='<option value="__new__">🆕 新建歌单</option>';
}

function renderPlaylistTabs() {
  const c=$('#playlistTabs'); const ids=Object.keys(state.playlists);
  if(!ids.length){ c.innerHTML='<div class="playlist-empty">暂无歌单<br>解析视频时可选择"🆕 新建歌单"</div>'; return; }
  c.innerHTML=ids.map(id=>{
    const pl=state.playlists[id], act=id===state.activePlaylistId;
    return`<div class="playlist-tab${act?' active':''}" onclick="selectPlaylist('${id}')">
      <span style="font-size:16px">📁</span><span class="tab-name">${esc(pl.name)}</span><span class="tab-count">${pl.songs.length}首</span>
      <div class="tab-actions" onclick="event.stopPropagation()">
        <button onclick="loadPlaylistToQueue('${id}')" title="加载到播放队列">▶</button>
        <button onclick="addPlaylistToQueue('${id}')" title="追加到播放队列">＋</button>
        ${pl.collectionInfo?`<button onclick="loadCollectionForPlaylist('${id}')" title="加载合集" style="color:var(--blue)">📋</button>`:''}
        <button onclick="deletePlaylist('${id}')" title="删除" style="color:#ff6b6b">🗑</button>
      </div></div>`;
  }).join('');
}

function selectPlaylist(id) {
  // 如果点击的是已展开的歌单，收起
  if (state.activePlaylistId === id) {
    state.activePlaylistId = null;
    $('#playlistExpand').style.display = 'none';
  } else {
    state.activePlaylistId = id;
    renderExpand();
  }
  renderPlaylistTabs();
}

function collapsePlaylist() {
  state.activePlaylistId = null;
  $('#playlistExpand').style.display = 'none';
  renderPlaylistTabs();
}

function renderExpand() {
  const id = state.activePlaylistId;
  const pl = state.playlists[id];
  if (!pl) { $('#playlistExpand').style.display = 'none'; return; }
  $('#playlistExpand').style.display = 'flex';
  $('#expandTitle').textContent = '📁 ' + pl.name;

  const list = $('#expandList');
  if (!pl.songs.length) {
    list.innerHTML = '<div class="playlist-empty">歌单为空<br>解析视频时选择此歌单添加歌曲</div>';
  } else {
    list.innerHTML = pl.songs.map((s, i) => `<div class="playlist-item">
      <span class="pl-index">${i + 1}</span>
      <div class="pl-cover">🎵</div>
      <div class="pl-info"><div class="pl-title">${esc(s.pageTitle || s.title || '未知')}</div><div class="pl-meta">${esc(s.owner?.name || '')}</div></div>
      <span class="pl-duration">${formatTime(s.duration)}</span>
      <button class="btn-remove" style="opacity:1;color:var(--green);margin-right:2px" onclick="event.stopPropagation();addSongToQueue(state.playlists['${id}'].songs[${i}])" title="添加到播放队列">＋</button>
      <button class="btn-remove" style="opacity:1" onclick="event.stopPropagation();removeFromPlaylist('${id}',${i})" title="从歌单移除">×</button>
    </div>`).join('');
  }

  // 展开区按钮事件
  $('#btnExpandPlay').onclick = () => loadPlaylistToQueue(id);
  $('#btnExpandAdd').onclick = () => addPlaylistToQueue(id);
  $('#btnExpandColl').onclick = () => loadCollectionForPlaylist(id);
  $('#btnExpandClose').onclick = collapsePlaylist;
}

function renderQueue() {
  const list=$('#playlistList'), cnt=$('#plCount');
  const collBtn=$('#btnLoadCollection');
  cnt.textContent=`${state.queue.length}首`;
  collBtn.textContent=state.collectionInfo?`📋 加载合集 (${state.collectionInfo.episodeCount||state.collectionInfo.episodes?.length||'?'}集)`:'📋 无合集';
  collBtn.disabled=!state.collectionInfo;
  if(!state.queue.length){ list.innerHTML='<div class="playlist-empty">👆 输入B站链接，<br>选择目标后开始 🎵</div>'; return; }
  list.innerHTML=state.queue.map((it,i)=>{ const act=i===state.currentIndex;
    return`<div class="playlist-item${act?' active':''}" onclick="playIndex(${i})">
      <span class="pl-index">${act?'▶':i+1}</span>
      <div class="pl-cover">${act?'🔊':'🎵'}</div>
      <div class="pl-info"><div class="pl-title">${esc(it.pageTitle||it.title||'未知')}</div><div class="pl-meta">${esc(it.owner?.name||'')}${it.page>1?' · P'+it.page:''}</div></div>
      <span class="pl-duration">${formatTime(it.duration)}</span>
      <button class="btn-remove" onclick="event.stopPropagation();removeFromQueue(${i})">×</button>
    </div>`;
  }).join('');
  const ac=document.querySelector('#playlistList .playlist-item.active');
  if(ac) ac.scrollIntoView({behavior:'smooth',block:'nearest'});
  // 同步展开区
  if(state.activePlaylistId) renderExpand();
}

// ==================== 事件 ====================
$('#btnParse').addEventListener('click',()=>{ const v=$('#urlInput').value.trim(); v?addVideo(v):toast('请输入链接',true); });
$('#urlInput').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#btnParse').click(); });
$('#btnPlay').addEventListener('click',()=>{
  if(!state.audio||!state.audio.src){ if(state.queue.length)playIndex(state.currentIndex>=0?state.currentIndex:0); return; }
  state.isPlaying?state.audio.pause():state.audio.play().catch(()=>toast('播放失败',true));
});
$('#btnPrev').addEventListener('click',playPrev);
$('#btnNext').addEventListener('click',playNext);
$('#progressBar').addEventListener('input',()=>{ if(state.audio&&state.audio.duration){ const t=($('#progressBar').value/1000)*state.audio.duration; state.audio.currentTime=t; $('#progressFill').style.width=($('#progressBar').value/10)+'%'; } });
$('#volumeSlider').addEventListener('input',()=>{ state.volume=$('#volumeSlider').value/100; if(state.audio)state.audio.volume=state.volume; saveAll(); });
$('#btnLoadCollection').addEventListener('click',loadCollectionToQueue);
$('#btnClearAll').addEventListener('click',clearQueue);
$('#btnNewPlaylist').addEventListener('click',()=>{ const n=prompt('歌单名称:','新歌单'); if(n&&n.trim())createPlaylist(n.trim()); });

// 侧边栏拖拽
(function(){
  const sb=$('#sidebar'), h=$('#resizeHandle'); let d=false,sx,sw;
  h.addEventListener('mousedown',e=>{ d=true; sx=e.clientX; sw=sb.offsetWidth; h.classList.add('active'); e.preventDefault(); });
  document.addEventListener('mousemove',e=>{ if(!d)return; sb.style.width=Math.max(260,Math.min(600,sw-(e.clientX-sx)))+'px'; });
  document.addEventListener('mouseup',()=>{ if(d){ d=false; h.classList.remove('active'); } });
})();

// 键盘
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){ e.preventDefault(); $('#btnPlay').click(); }
  if(e.code==='ArrowLeft'){ e.preventDefault(); if(state.audio)state.audio.currentTime=Math.max(0,state.audio.currentTime-5); }
  if(e.code==='ArrowRight'){ e.preventDefault(); if(state.audio)state.audio.currentTime=Math.min(state.audio.duration||0,state.audio.currentTime+5); }
  if(e.code==='ArrowUp'){ e.preventDefault(); state.volume=Math.min(1,state.volume+.05); $('#volumeSlider').value=state.volume*100; if(state.audio)state.audio.volume=state.volume; saveAll(); }
  if(e.code==='ArrowDown'){ e.preventDefault(); state.volume=Math.max(0,state.volume-.05); $('#volumeSlider').value=state.volume*100; if(state.audio)state.audio.volume=state.volume; saveAll(); }
});

function init() { $('#volumeSlider').value=state.volume*100; initAudio(); loadAll(); }
init();
</script>
</body>
</html>
